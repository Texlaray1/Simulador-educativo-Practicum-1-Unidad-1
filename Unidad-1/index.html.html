<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador · Autoconocimiento y Vocación Docente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#141f33;
    --navy-900:#1c2b45;
    --navy-800:#24365a;
    --navy-700:#324873;
    --bronze:#b08833;
    --bronze-dark:#8f6c22;
    --paper:#f7f4ec;
    --paper-2:#efe9db;
    --ink:#24221d;
    --ink-soft:#5c5648;
    --line:#dad3c2;
    --success:#3f7a4e;
    --success-bg:#e9f2ea;
    --error:#a6423d;
    --error-bg:#f7eae9;
    --radius-card: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Source Serif 4',serif; margin:0; color:var(--navy-900); font-weight:600;}
  p{margin:0 0 .9em 0;}
  .app{max-width:900px;margin:0 auto; padding-bottom:64px;}

  /* HEADER */
  .institutional{
    background:linear-gradient(180deg,var(--navy-950),var(--navy-900));
    color:#eee7d6;
    padding:22px 28px 20px;
    border-bottom:3px solid var(--bronze);
  }
  .institutional .crest-row{display:flex; align-items:center; gap:14px;}
  .crest{
    width:46px;height:46px;flex:0 0 auto;border-radius:50%;
    border:1.5px solid var(--bronze);
    display:flex;align-items:center;justify-content:center;
    font-family:'Source Serif 4',serif;font-weight:700;font-size:15px;color:var(--bronze);
    background:rgba(176,136,51,0.08);
  }
  .institutional .lines{font-size:12.5px; letter-spacing:.2px; color:#cfc7ae;}
  .institutional .lines strong{color:#f3ecd9; display:block; font-family:'Source Serif 4',serif; font-size:15.5px; font-weight:600; margin-bottom:1px;}
  .institutional .lines span{display:block;}
  .institutional .sim-title{margin-top:16px;}
  .institutional .sim-title h1{color:#f7f3e6; font-size:24px; line-height:1.25;}
  .institutional .sim-title .unidad{color:var(--bronze); font-size:13px; font-weight:600; margin-bottom:5px; font-family:'Inter',sans-serif;}

  /* STEPPER */
  .stepper{
    display:flex; background:var(--paper-2); border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .step-btn{
    flex:1 1 0; min-width:92px; text-align:left; background:none; border:none; cursor:pointer;
    padding:10px 10px 9px; font-family:'Inter',sans-serif; color:var(--ink-soft);
    border-bottom:3px solid transparent; font-size:11.5px; transition:border-color .15s, color .15s;
  }
  .step-btn .num{display:block; font-size:10px; color:var(--bronze-dark); font-weight:700; margin-bottom:2px;}
  .step-btn.active{color:var(--navy-900); border-bottom-color:var(--bronze); font-weight:600;}
  .step-btn.done{color:var(--navy-800);}
  .step-btn:disabled{opacity:.42; cursor:not-allowed;}

  /* CONTENT */
  .panel{padding:30px 28px 10px;}
  .panel .eyebrow{font-size:12.5px; color:var(--bronze-dark); font-weight:600; margin-bottom:6px;}
  .panel h2{font-size:22px; margin-bottom:14px;}
  .lead{font-size:15.5px; color:var(--ink-soft); max-width:64ch;}

  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-card);
    padding:18px 20px; margin-bottom:14px;
  }
  .card h3{font-size:16.5px; margin-bottom:6px;}
  .card .tag{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.3px;
    color:var(--bronze-dark); border:1px solid var(--bronze); border-radius:2px;
    padding:1px 7px; margin-bottom:10px;
  }
  .card p{font-size:14.5px; color:var(--ink);}
  .card p.small{font-size:13px; color:var(--ink-soft);}

  /* glossary */
  abbr.gloss{
    border-bottom:1px dotted var(--bronze-dark); text-decoration:none; color:inherit; cursor:help;
  }

  /* audio buttons */
  .audio-btn{
    font-family:'Inter'; font-size:12px; font-weight:600; border:1px solid var(--bronze);
    color:var(--bronze-dark); background:#fff; border-radius:14px; padding:4px 12px;
    cursor:pointer; display:inline-block; margin:2px 0 10px;
  }
  .audio-btn:hover{background:var(--paper-2);}
  .analogy-card .audio-btn{background:transparent; border-color:var(--bronze); color:var(--bronze); margin:0;}

  /* theory */
  details.theory{
    background:#fff; border:1px solid var(--line); border-left:3px solid var(--navy-800);
    margin-bottom:9px; border-radius:2px;
  }
  details.theory summary{
    padding:12px 16px; cursor:pointer; font-family:'Source Serif 4',serif; font-weight:600;
    font-size:15.5px; color:var(--navy-900); list-style:none; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  details.theory summary::-webkit-details-marker{display:none;}
  details.theory summary::after{content:"+"; font-family:'Inter'; font-size:19px; color:var(--bronze-dark); font-weight:400; flex:0 0 auto;}
  details.theory[open] summary::after{content:"–";}
  details.theory .theory-body{padding:0 16px 16px; font-size:14.3px; color:var(--ink);}
  details.theory .theory-body .authors{font-size:12.5px; color:var(--ink-soft); margin-top:8px; font-style:italic;}

  /* view toggle */
  .view-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .vt-btn{
    font-family:'Inter'; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:14px;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .vt-btn.active{border-color:var(--navy-900); background:var(--navy-900); color:#f4eedd;}

  /* timeline */
  .timeline{position:relative; padding-left:22px; border-left:2px solid var(--line); margin-top:8px;}
  .tl-item{position:relative; margin-bottom:24px;}
  .tl-dot{position:absolute; left:-29px; top:5px; width:10px; height:10px; border-radius:50%; background:var(--bronze); box-shadow:0 0 0 3px var(--paper);}
  .tl-year{font-family:'Source Serif 4',serif; font-weight:700; color:var(--bronze-dark); font-size:13px; margin-bottom:3px;}
  .tl-item h3{font-size:15.5px; margin-bottom:4px;}
  .tl-item .authors{font-size:12px; color:var(--ink-soft); font-style:italic;}

  /* analogies */
  .analogy-card{
    background:var(--navy-900); color:#efe9d9; border-radius:var(--radius-card);
    padding:20px 22px; margin-bottom:14px; position:relative; overflow:hidden;
    display:flex; gap:16px; align-items:flex-start;
  }
  .analogy-card::before{content:""; position:absolute; top:0; right:0; width:5px; height:100%; background:var(--bronze);}
  .analogy-icon{width:54px; height:54px; flex:0 0 auto; margin-top:2px;}
  .ic-shape{fill:none; stroke:var(--bronze); stroke-width:2;}
  .ic-shape-dim{fill:none; stroke:var(--bronze); stroke-width:2; stroke-dasharray:3 3; opacity:.55;}
  .ic-line{stroke:#efe9d9; stroke-width:2; fill:none; opacity:.8;}
  .analogy-text{flex:1; min-width:0;}
  .analogy-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .analogy-card h3{color:#f4eddb; font-size:16.5px; margin-bottom:0;}
  .analogy-card .concept{font-size:11.5px; color:var(--bronze); font-weight:600; letter-spacing:.3px; margin-bottom:9px;}
  .analogy-card p{color:#d8d1bd; font-size:14.3px; margin-bottom:0; margin-top:8px;}

  /* scenario */
  .scenario-box{
    background:var(--paper-2); border-left:3px solid var(--bronze); padding:16px 18px;
    margin-bottom:18px; border-radius:2px;
  }
  .scenario-box .who{font-family:'Source Serif 4',serif; font-weight:600; color:var(--navy-900); font-size:15.5px; margin-bottom:5px;}
  .scenario-box p{font-size:14.5px; margin-bottom:0; color:var(--ink);}

  /* open response */
  .open-response{background:var(--paper-2); border:1px dashed var(--bronze); border-radius:2px; padding:12px 14px; margin-bottom:10px;}
  .or-label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:7px;}
  .or-input{
    width:100%; font-family:'Inter'; font-size:13.5px; padding:9px 11px; border:1px solid var(--line);
    border-radius:2px; resize:vertical; margin-bottom:9px; background:#fff; color:var(--ink);
  }
  .or-recall{background:var(--paper-2); border-left:2px solid var(--navy-700); padding:9px 12px; font-size:13px; color:var(--ink-soft); margin-bottom:12px; border-radius:2px;}
  .or-tag{display:block; font-size:10.5px; font-weight:700; color:var(--navy-700); margin-bottom:2px; letter-spacing:.2px;}

  .question-block{margin-bottom:22px;}
  .question-block .qtext{font-size:15px; font-weight:600; color:var(--navy-900); margin-bottom:10px; font-family:'Source Serif 4',serif;}
  .option{
    display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border:1px solid var(--line);
    border-radius:2px; margin-bottom:7px; cursor:pointer; background:#fff; transition:border-color .15s, background .15s;
  }
  .option:hover{border-color:var(--navy-700);}
  .option input{margin-top:3px; flex:0 0 auto;}
  .option .otext{font-size:14px; color:var(--ink);}
  .option.correct{border-color:var(--success); background:var(--success-bg);}
  .option.incorrect{border-color:var(--error); background:var(--error-bg);}
  .option.locked{cursor:default;}

  .feedback-box{margin-top:8px; padding:12px 15px; border-radius:2px; font-size:13.8px; display:none;}
  .feedback-box.show{display:block;}
  .feedback-box.correct{background:var(--success-bg); border:1px solid var(--success); color:#274f31;}
  .feedback-box.incorrect{background:var(--error-bg); border:1px solid var(--error); color:#6e2e2a;}
  .feedback-box .verdict{font-weight:700; display:block; margin-bottom:3px; font-family:'Source Serif 4',serif; font-size:14.5px;}

  .btn-row{display:flex; gap:10px; margin-top:22px; padding-top:16px; border-top:1px solid var(--line); justify-content:space-between; flex-wrap:wrap;}
  .btn{
    font-family:'Inter'; font-size:13.5px; font-weight:600; padding:10px 20px; border-radius:2px;
    border:1px solid var(--navy-900); background:var(--navy-900); color:#f4eedd; cursor:pointer;
    transition:background .15s;
  }
  .btn:hover{background:var(--navy-700);}
  .btn.ghost{background:none; color:var(--navy-900); border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--navy-900);}
  .btn.small{padding:6px 14px; font-size:12.5px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  /* route choice */
  .route-row{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}

  /* breathing pause */
  .breathing-wrap{display:flex; flex-direction:column; align-items:center; padding:26px 10px; margin-bottom:10px;}
  .breathing-circle{
    width:110px; height:110px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #cfa24d, var(--bronze-dark));
    animation:breathe 14s ease-in-out infinite;
    box-shadow:0 0 0 1px var(--bronze);
  }
  @keyframes breathe{
    0%{transform:scale(.62);}
    28%{transform:scale(1);}
    57%{transform:scale(1);}
    100%{transform:scale(.62);}
  }
  .breathing-hint{margin-top:16px; font-size:13px; color:var(--ink-soft); text-align:center;}

  /* ficha */
  .field-label{display:block; font-size:13px; font-weight:600; color:var(--navy-800); margin:12px 0 6px;}
  .field-input{
    width:100%; font-family:'Inter'; font-size:13.8px; padding:9px 11px; border:1px solid var(--line);
    border-radius:2px; background:#fff; color:var(--ink); resize:vertical;
  }
  .field-input.line{margin-bottom:8px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{
    display:flex; align-items:center; gap:6px; font-size:13px; border:1px solid var(--line);
    border-radius:14px; padding:6px 12px; cursor:pointer; background:#fff; color:var(--ink-soft);
  }
  .chip.checked{border-color:var(--bronze); color:var(--bronze-dark); background:var(--paper-2);}
  .chip.block{display:flex; width:100%; border-radius:2px; margin-bottom:7px;}
  .chip input{margin:0;}
  .slider-row{display:flex; align-items:center; gap:12px; margin-top:6px;}
  .slider-row input[type=range]{flex:1;}
  .slider-val{font-size:13px; font-weight:600; color:var(--navy-800); min-width:34px;}
  .record-row{display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap;}
  .record-row audio{max-width:100%;}

  .score-tag{
    display:inline-block; font-size:12.5px; font-weight:600; color:var(--navy-800);
    background:var(--paper-2); border:1px solid var(--line); border-radius:2px; padding:3px 10px; margin-bottom:14px;
  }

  .final-summary{background:#fff; border:1px solid var(--line); border-radius:2px; padding:22px 24px; margin-bottom:16px;}
  .final-summary .level{font-family:'Source Serif 4',serif; font-size:19px; color:var(--navy-900); margin-bottom:6px;}
  .final-summary .bar-track{height:8px; background:var(--paper-2); border-radius:4px; overflow:hidden; margin:10px 0 16px;}
  .final-summary .bar-fill{height:100%; background:var(--bronze);}

  .result-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .result-tile{border:1px solid var(--line); border-radius:2px; padding:14px 16px; background:#fff;}
  .result-tile .n{font-family:'Source Serif 4',serif; font-size:26px; color:var(--navy-900);}
  .result-tile .lbl{font-size:12px; color:var(--ink-soft);}
  .result-tile.ok .n{color:var(--success);}
  .result-tile.bad .n{color:var(--error);}

  .test-item-status{
    display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid var(--line);
    border-radius:2px; margin-bottom:6px; font-size:13.5px; background:#fff;
  }
  .test-item-status .dot{width:9px;height:9px;border-radius:50%; flex:0 0 auto;}
  .test-item-status .dot.ok{background:var(--success);}
  .test-item-status .dot.bad{background:var(--error);}

  footer.note{padding:20px 28px 34px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line); margin-top:8px;}

  @media (max-width:600px){
    .panel{padding:22px 16px 6px;}
    .institutional{padding:18px 16px;}
    .result-grid{grid-template-columns:1fr;}
    .step-btn{min-width:78px; font-size:10.5px;}
    .analogy-card{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================= GLOSARIO ============================= */

const GLOSSARY = {
  "autoconocimiento": "Reconocer la propia historia, emociones, valores y creencias en juego al enseñar.",
  "vocación": "Disposición hacia la docencia que se construye y se cultiva con el tiempo.",
  "autoconciencia": "Notar una emoción propia en el momento en que aparece.",
  "autorregulación": "Gestionar de forma consciente una emoción ya notada, sin dejarse gobernar por ella.",
  "tacto pedagógico": "Sensibilidad para actuar en el momento oportuno frente al estudiantado; se desarrolla con la práctica.",
  "zona ciega": "Rasgo propio visible para otras personas pero invisible para uno mismo.",
  "ventana de johari": "Modelo con cuatro áreas del yo: lo abierto, lo oculto, lo ciego y lo desconocido.",
  "reflexión en la acción": "Pensar sobre lo que se hace mientras se está haciendo.",
  "reflexión sobre la acción": "Pensar sobre lo ocurrido después de que pasó.",
  "aprendizaje transformador": "Examinar de manera crítica los supuestos que normalmente se dan por sentados.",
  "fit-choice": "Escala que agrupa los motivos que llevan a elegir la docencia.",
  "identidad profesional": "Respuesta siempre abierta a la pregunta de quién es uno como docente."
};

function applyGlossary(text){
  let out = text;
  const terms = Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
  terms.forEach(term=>{
    const escaped = term.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&');
    const re = new RegExp('\\b('+escaped+')\\b', 'i');
    out = out.replace(re, function(match){
      const def = GLOSSARY[term].replace(/"/g,'&quot;');
      return '<abbr class="gloss" title="'+def+'">'+match+'</abbr>';
    });
  });
  return out;
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================= CONTENIDO TEÓRICO ============================= */

const THEORY = [
  {
    tag:"Núcleo de la identidad",
    title:"El autoconocimiento como base de la práctica docente",
    body:`El autoconocimiento es la capacidad de reconocer la propia historia, motivaciones,
    emociones, valores y creencias que se ponen en juego al enseñar. Korthagen, con su modelo de
    niveles de cambio, ubica la identidad y la misión personal en el centro de la actuación docente:
    debajo de las competencias y las conductas observables está el "quién soy y para qué enseño",
    que es lo que sostiene y da coherencia a todo lo demás. Por eso formarse como docente no puede
    reducirse a aprender técnicas: exige también un trabajo consciente sobre uno mismo.`,
    authors:"Korthagen (2004)"
  },
  {
    tag:"Vocación",
    title:"La vocación como disposición que se construye",
    body:`La vocación docente no es un llamado fijo o romántico anterior a toda experiencia; es una
    disposición que se construye y reconstruye a lo largo de la trayectoria personal y profesional.
    Enseñar es una opción ética y política, no solo técnica, que implica un compromiso sostenido con
    el otro. La pasión y el compromiso emocional que sostienen la calidad de la enseñanza deben
    cultivarse de manera deliberada; no se poseen de una vez y para siempre.`,
    authors:"Freire (1997); Day (2004)"
  },
  {
    tag:"Raíces biográficas",
    title:"La biografía escolar como precomprensión",
    body:`La identidad docente se construye narrativamente: mucho antes de comenzar la formación
    profesional, toda persona ya ha internalizado modelos implícitos de lo que significa enseñar,
    a partir de sus propios años como estudiante. Estos modelos —positivos y negativos— influyen en
    las expectativas, temores y certezas con que se llega al Prácticum, muchas veces sin que la
    persona los haya hecho conscientes. El tacto pedagógico, esa sensibilidad para actuar
    oportunamente frente al estudiantado, tampoco es innato: se desarrolla progresivamente
    reflexionando sobre la propia experiencia.`,
    authors:"Bolívar (2006); Van Manen (1998)"
  },
  {
    tag:"Dimensión emocional",
    title:"La enseñanza como trabajo emocional",
    body:`La autoconciencia —reconocer las propias emociones en el momento en que ocurren— es la
    competencia base de la inteligencia emocional, sobre la cual se construyen la autorregulación y
    la empatía. La enseñanza es un trabajo profundamente emocional: el sentido de identidad del
    profesorado está ligado a lo que siente en el aula. La satisfacción, la frustración, el
    entusiasmo o el agotamiento no son ruido externo a la profesión, sino parte de cómo cada persona
    se experimenta a sí misma como docente.`,
    authors:"Goleman (1995); Nias (1996)"
  },
  {
    tag:"Dimensión emocional",
    title:"Autorregulación: el paso que sigue a la autoconciencia",
    body:`Reconocer una emoción no es lo mismo que saber qué hacer con ella. La autorregulación es
    la competencia que se construye sobre la autoconciencia: mientras la autoconciencia permite
    identificar que se siente nerviosismo, frustración o agotamiento, la autorregulación es la
    capacidad de gestionar esa emoción de forma consciente, sin negarla ni dejarse gobernar por
    ella. En la práctica docente, esto se traduce en la diferencia entre reaccionar de forma
    impulsiva ante una emoción intensa —por ejemplo, endurecerse frente a un comentario que
    incomoda— y responder con una decisión consciente después de haber reconocido lo que se siente.
    Por eso la autorregulación no puede trabajarse antes que la autoconciencia: no es posible
    regular una emoción que todavía no se ha identificado.`,
    authors:"Goleman (1995)"
  },
  {
    tag:"Dimensión cognitivo-valorativa",
    title:"Las creencias implícitas sobre enseñar y aprender",
    body:`Antes de examinarlas explícitamente, cada estudiante trae consigo creencias implícitas
    sobre qué es enseñar, cómo se aprende y cuál es el papel del docente. El autoconocimiento es la
    condición previa para poder identificarlas: no es posible cuestionar una creencia que permanece
    invisible para quien la sostiene. Esta dimensión se profundiza más adelante, en la Unidad 2.`,
    authors:"Se retoma en la Unidad 2"
  },
  {
    tag:"Dimensión social y relacional",
    title:"La ventana de Johari: lo que otros ven y yo no",
    body:`El autoconocimiento no es un ejercicio puramente introspectivo. Toda persona tiene
    aspectos de sí misma que le son evidentes, pero también zonas ciegas que solo se hacen visibles
    a través de la retroalimentación de otros. Aplicado a la formación docente, esto significa que
    el diálogo con pares, con el profesor de Prácticum y con los actores de los centros educativos
    no es un complemento del autoconocimiento: es una de sus vías de acceso más importantes.`,
    authors:"Luft e Ingham (1955), modelo de la ventana de Johari"
  },
  {
    tag:"Herramientas",
    title:"Reflexión, aprendizaje transformador y portafolio",
    body:`Existe la reflexión en la acción, que ocurre en el momento mismo de actuar, y la reflexión
    sobre la acción, que se realiza después, al revisar lo ocurrido; ambas convierten la experiencia
    en aprendizaje sobre uno mismo como futuro docente. El aprendizaje transformador exige someter a
    examen crítico los supuestos y marcos de referencia que se dan por sentados, muchos adquiridos

function initState(){
  const caseMeta = {};
  Object.keys(CASES).forEach(k=>{
    const n = CASES[k].questions.length;
    caseMeta[k] = { reveal:new Array(n).fill(false), open:new Array(n).fill("") };
  });
  return {
    current: 0,
    furthest: 0,
    caseAnswers: { basic:[], intermediate:[], advanced:[] },
    caseMeta: caseMeta,
    testAnswers: [],
    theoryView: 'accordion',
    ficha: {
      bio1:"", bio2:"",
      emotions:[], readiness:3, emoWhy:"",
      motivations:[], motivWhy:"",
      identity1:"", identity2:"",
      portrait:"", recording:false, audioUrl:null, recordError:false,

    }
  };
}
let state = initState();
window.__lastChoice = {};
window.__lastTestChoice = {};
window.__speakingBtn = null;
let mediaRecorder = null;
let audioChunks = [];

function goTo(idx){
  if(idx > state.furthest) return;
  state.current = idx;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function advance(){
  if(state.current < STEPS.length - 1){
    state.current += 1;
    if(state.current > state.furthest) state.furthest = state.current;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  }
}
function back(){
  if(state.current > 0){ state.current -= 1; render(); window.scrollTo({top:0, behavior:"smooth"}); }
}
function startRoute(targetId){
  const idx = STEPS.findIndex(s=>s.id===targetId);
  if(idx<0) return;
  state.current = idx;
  if(idx>state.furthest) state.furthest = idx;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ============================= AUDIO (TTS) ============================= */

function speakText(btnId, text){
  if(!('speechSynthesis' in window)){
    alert('Tu navegador no permite lectura en voz alta en este momento.');
    return;
  }
  const btn = document.getElementById(btnId);
  if(window.__speakingBtn === btnId){
    speechSynthesis.cancel();
    window.__speakingBtn = null;
    if(btn) btn.textContent = btn.dataset.label || '🔊 Escuchar';
    return;
  }
  speechSynthesis.cancel();
  const clean = text.replace(/\s+/g,' ').trim();
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'es-ES';
  utter.rate = 0.98;
  utter.onend = function(){
    window.__speakingBtn = null;
    if(btn) btn.textContent = btn.dataset.label || '🔊 Escuchar';
  };
  window.__speakingBtn = btnId;
  if(btn){ btn.dataset.label = btn.textContent; btn.textContent = '⏸ Detener'; }
  speechSynthesis.speak(utter);
}
function speakTheory(i){ const t=THEORY[i]; speakText('audio-theory-'+i, t.title+'. '+t.body); }
function speakAnalogy(i){ const a=ANALOGIES[i]; speakText('audio-an-'+i, a.title+'. '+a.body); }
function speakScenario(key){ const c=CASES[key]; speakText('audio-case-'+key, c.who+'. '+c.scenario); }
function speakTestScenario(){ speakText('audio-test', FINAL_TEST.who+'. '+FINAL_TEST.scenario); }

function renderQuestion(caseKey, qIndex, q, answeredCorrect){
  const meta = state.caseMeta[caseKey];
  const revealed = meta.reveal[qIndex];
  const openVal = meta.open[qIndex] || "";
  const answered = answeredCorrect !== undefined;

  if(!revealed){
    return `
      <div class="question-block">
        <div class="qtext">${qIndex+1}. ${q.prompt}</div>
        <div class="open-response">
          <label class="or-label">Antes de ver las opciones, escribe brevemente tu propia respuesta (no se califica):</label>
          <textarea class="or-input" rows="2" placeholder="Escribe aquí tu idea..." oninput="updateOpenResponse('${caseKey}',${qIndex},this.value)">${escapeHtml(openVal)}</textarea>
          <button class="btn ghost small" onclick="revealOptions('${caseKey}',${qIndex})">Ya reflexioné, ver opciones →</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="question-block">
      <div class="qtext">${qIndex+1}. ${q.prompt}</div>
      ${openVal ? `<div class="or-recall"><span class="or-tag">Tu respuesta inicial</span>${escapeHtml(openVal)}</div>` : ''}
      ${q.options.map((opt,oi)=>{
        let cls = "option";
        if(answered){
          cls += " locked";
          if(opt.correct) cls += " correct";
        }
        return `
          <label class="${cls}" onclick="${answered?'':`answerCase('${caseKey}',${qIndex},${oi})`}">
            <input type="radio" name="q-${caseKey}-${qIndex}" ${answered?'disabled':''}>
            <span class="otext">${opt.text}</span>
          </label>`;
      }).join('')}
      <div id="fb-${caseKey}-${qIndex}" class="feedback-box ${answered? (answeredCorrect?'correct show':'incorrect show') : ''}">
        ${answered ? feedbackHtml(caseKey,qIndex,answeredCorrect) : ''}
      </div>
    </div>
  `;
}

function feedbackHtml(caseKey, qIndex, wasCorrect){
  const q = CASES[caseKey].questions[qIndex];
  const chosen = window.__lastChoice[caseKey+'-'+qIndex];
  const opt = chosen!==undefined ? q.options[chosen] : q.options.find(o=>o.correct);
  return `<span class="verdict">${wasCorrect? "Acertaste" : "No del todo"}</span>${opt.feedback}`;
}

function revealOptions(caseKey, qIndex){
  state.caseMeta[caseKey].reveal[qIndex] = true;
  render();
  const el = document.getElementById('case-questions');
  if(el) el.scrollIntoView({behavior:"instant", block:"start"});
}
function updateOpenResponse(caseKey, qIndex, val){
  state.caseMeta[caseKey].open[qIndex] = val;
}
function answerCase(caseKey, qIndex, optIndex){
  const q = CASES[caseKey].questions[qIndex];
  const opt = q.options[optIndex];
  window.__lastChoice[caseKey+'-'+qIndex] = optIndex;
  state.caseAnswers[caseKey][qIndex] = !!opt.correct;

}

    Te sugerimos releer el marco teórico completo, especialmente los apartados de Korthagen, Bolívar
    y Palmer, antes de continuar con la evaluación final.`;
  }

  return `
    <div class="eyebrow">Retroalimentación de tu recorrido</div>
    <h2>Síntesis formativa de los tres casos</h2>

      <div class="level">${levelMsg}</div>

    <div class="result-grid">
      ${summaries.map(s=>`
        <div class="result-tile">

      incorrectas, sin explicación teórica por pregunta.</p>

function renderTestQuestion(qIndex, q, answeredCorrect){

async function startRecording(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = function(){
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      state.ficha.audioUrl = URL.createObjectURL(blob);
      stream.getTracks().forEach(t=>t.stop());
      render();
    };
    mediaRecorder.start();
    state.ficha.recording = true;
    state.ficha.recordError = false;
    render();
  }catch(err){
    state.ficha.recordError = true;
    render();
  }
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state === 'recording'){ mediaRecorder.stop(); }
  state.ficha.recording = false;
}
function resetRecording(){
  state.ficha.audioUrl = null;
  state.ficha.recordError = false;
  render();
}

function downloadTextSummary(){
  const blob = new Blob([buildTextSummary()], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'resumen_autoconocimiento_vocacion.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  for(let n=0;n<words.length;n++){
    const test = line + words[n] + ' ';
    if(ctx.measureText(test).width > maxWidth && n>0){
      ctx.fillText(line, x, y);
      line = words[n] + ' ';
      y += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, y);
  return y + lineHeight;
}

function downloadVisualSummary(){
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 560;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f7f4ec'; ctx.fillRect(0,0,800,560);
  ctx.fillStyle = '#1c2b45'; ctx.fillRect(0,0,800,92);
  ctx.fillStyle = '#b08833'; ctx.fillRect(0,88,800,4);
  ctx.fillStyle = '#f4eedd'; ctx.font = "bold 22px Georgia";
  ctx.fillText('Autoconocimiento y Vocación Docente', 30, 40);
  ctx.font = "13px Arial"; ctx.fillStyle = '#cfc7ae';
  ctx.fillText('UPNFM · Practicum I · Resumen de tu recorrido', 30, 65);

  let y = 130;
  ctx.font = "16px Arial"; ctx.fillStyle = '#24221d';
  ["basic","intermediate","advanced"].forEach(k=>{
    const c = CASES[k]; const ans = state.caseAnswers[k];
    ctx.fillText(c.level+': '+ans.filter(Boolean).length+'/'+ans.length+' aciertos', 30, y);
    y += 30;
  });
  y += 6;
  ctx.fillText('Evaluación final: '+state.testAnswers.filter(Boolean).length+'/'+state.testAnswers.length+' aciertos', 30, y);
  y += 34;

  ctx.fillStyle = '#b08833'; ctx.fillRect(30, y, 740, 3);
  y += 34;

  ctx.fillStyle = '#5c5648'; ctx.font = "italic 14px Arial";
  y = wrapCanvasText(ctx, 'La identidad docente es un proceso continuo: este resumen es un punto de partida, no un cierre.', 30, y, 740, 20);
  y += 10;
  if(state.ficha.portrait){
    ctx.fillStyle = '#24221d'; ctx.font = "13px Arial";
    y = wrapCanvasText(ctx, 'Autorretrato: ' + state.ficha.portrait.slice(0,220), 30, y, 740, 18);
  }

  const link = document.createElement('a');
  link.download = 'tarjeta_resumen_autoconocimiento.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
