<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador · Creencias Pedagógicas y su Influencia en la Práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#141f33; --navy-900:#1c2b45; --navy-800:#24365a; --navy-700:#324873;
    --bronze:#b08833; --bronze-dark:#8f6c22;
    --paper:#f7f4ec; --paper-2:#efe9db;
    --ink:#24221d; --ink-soft:#5c5648; --line:#dad3c2;
    --success:#3f7a4e; --success-bg:#e9f2ea;
    --error:#a6423d; --error-bg:#f7eae9;
    --radius-card:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Source Serif 4',serif; margin:0; color:var(--navy-900); font-weight:600;}
  p{margin:0 0 .9em 0;}
  .app{max-width:900px;margin:0 auto; padding-bottom:64px;}

  .institutional{background:linear-gradient(180deg,var(--navy-950),var(--navy-900)); color:#eee7d6; padding:22px 28px 20px; border-bottom:3px solid var(--bronze);}
  .institutional .crest-row{display:flex; align-items:center; gap:14px;}
  .crest{width:46px;height:46px;flex:0 0 auto;border-radius:50%; border:1.5px solid var(--bronze); display:flex;align-items:center;justify-content:center; font-family:'Source Serif 4',serif;font-weight:700;font-size:15px;color:var(--bronze); background:rgba(176,136,51,0.08);}
  .institutional .lines{font-size:12.5px; letter-spacing:.2px; color:#cfc7ae;}
  .institutional .lines strong{color:#f3ecd9; display:block; font-family:'Source Serif 4',serif; font-size:15.5px; font-weight:600; margin-bottom:1px;}
  .institutional .lines span{display:block;}
  .institutional .sim-title{margin-top:16px;}
  .institutional .sim-title h1{color:#f7f3e6; font-size:23px; line-height:1.28;}
  .institutional .sim-title .unidad{color:var(--bronze); font-size:13px; font-weight:600; margin-bottom:5px;}

  .stepper{display:flex; background:var(--paper-2); border-bottom:1px solid var(--line); overflow-x:auto;}
  .step-btn{flex:1 1 0; min-width:88px; text-align:left; background:none; border:none; cursor:pointer; padding:10px 9px 9px; color:var(--ink-soft); border-bottom:3px solid transparent; font-size:11px; transition:border-color .15s,color .15s;}
  .step-btn .num{display:block; font-size:9.5px; color:var(--bronze-dark); font-weight:700; margin-bottom:2px;}
  .step-btn.active{color:var(--navy-900); border-bottom-color:var(--bronze); font-weight:600;}
  .step-btn.done{color:var(--navy-800);}
  .step-btn:disabled{opacity:.42; cursor:not-allowed;}

  .panel{padding:30px 28px 10px;}
  .panel .eyebrow{font-size:12.5px; color:var(--bronze-dark); font-weight:600; margin-bottom:6px;}
  .panel h2{font-size:22px; margin-bottom:14px;}
  .lead{font-size:15.5px; color:var(--ink-soft); max-width:64ch;}

  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-card); padding:18px 20px; margin-bottom:14px;}
  .card h3{font-size:16.5px; margin-bottom:6px;}
  .card .tag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.3px; color:var(--bronze-dark); border:1px solid var(--bronze); border-radius:2px; padding:1px 7px; margin-bottom:10px;}
  .card p{font-size:14.5px; color:var(--ink);}
  .card p.small{font-size:13px; color:var(--ink-soft);}

  abbr.gloss{border-bottom:1px dotted var(--bronze-dark); text-decoration:none; color:inherit; cursor:help;}

  .audio-btn{font-size:12px; font-weight:600; border:1px solid var(--bronze); color:var(--bronze-dark); background:#fff; border-radius:14px; padding:4px 12px; cursor:pointer; display:inline-block; margin:2px 0 10px;}
  .audio-btn:hover{background:var(--paper-2);}
  .analogy-card .audio-btn{background:transparent; border-color:var(--bronze); color:var(--bronze); margin:0;}

  details.theory{background:#fff; border:1px solid var(--line); border-left:3px solid var(--navy-800); margin-bottom:9px; border-radius:2px;}
  details.theory summary{padding:12px 16px; cursor:pointer; font-family:'Source Serif 4',serif; font-weight:600; font-size:15.5px; color:var(--navy-900); list-style:none; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  details.theory summary::-webkit-details-marker{display:none;}
  details.theory summary::after{content:"+"; font-size:19px; color:var(--bronze-dark); font-weight:400;}
  details.theory[open] summary::after{content:"–";}
  details.theory .theory-body{padding:0 16px 16px; font-size:14.3px; color:var(--ink);}
  details.theory .theory-body .authors{font-size:12.5px; color:var(--ink-soft); margin-top:8px; font-style:italic;}

  .view-toggle{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .vt-btn{font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:14px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;}
  .vt-btn.active{border-color:var(--navy-900); background:var(--navy-900); color:#f4eedd;}

  .dimension-card{display:flex; gap:14px; align-items:flex-start; background:#fff; border:1px solid var(--line); border-left:4px solid var(--bronze); border-radius:2px; padding:14px 16px; margin-bottom:10px;}
  .dimension-num{flex:0 0 auto; width:30px; height:30px; border-radius:50%; background:var(--navy-900); color:#f4eedd; font-family:'Source Serif 4',serif; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;}
  .dimension-card h4{font-size:14.5px; color:var(--navy-900); margin-bottom:3px;}
  .dimension-card p{font-size:13.5px; color:var(--ink-soft); margin-bottom:0;}

  .flow-grid{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:18px;}
  .flow-box{background:#fff; border:1.5px solid var(--bronze); border-radius:6px; padding:10px 14px; font-size:13px; font-weight:600; color:var(--navy-900); text-align:center; min-width:110px;}
  .flow-arrow{color:var(--bronze-dark); font-size:18px; padding:0 2px;}
  .flow-break{flex-basis:100%; height:0;}

  .timeline{position:relative; padding-left:22px; border-left:2px solid var(--line); margin-top:8px;}
  .tl-item{position:relative; margin-bottom:24px;}
  .tl-dot{position:absolute; left:-29px; top:5px; width:10px; height:10px; border-radius:50%; background:var(--bronze); box-shadow:0 0 0 3px var(--paper);}
  .tl-item h3{font-size:15.5px; margin-bottom:4px;}
  .tl-item .authors{font-size:12px; color:var(--ink-soft); font-style:italic;}

  .analogy-card{background:var(--navy-900); color:#efe9d9; border-radius:var(--radius-card); padding:20px 22px; margin-bottom:14px; position:relative; overflow:hidden; display:flex; gap:16px; align-items:flex-start;}
  .analogy-card::before{content:""; position:absolute; top:0; right:0; width:5px; height:100%; background:var(--bronze);}
  .analogy-icon{width:54px; height:54px; flex:0 0 auto; margin-top:2px;}
  .ic-shape{fill:none; stroke:var(--bronze); stroke-width:2;}
  .ic-shape-dim{fill:none; stroke:var(--bronze); stroke-width:2; stroke-dasharray:3 3; opacity:.55;}
  .ic-line{stroke:#efe9d9; stroke-width:2; fill:none; opacity:.8;}
  .ic-dot{fill:var(--bronze); stroke:none;}
  .analogy-text{flex:1; min-width:0;}
  .analogy-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .analogy-card h3{color:#f4eddb; font-size:16.5px; margin-bottom:0;}
  .analogy-card .concept{font-size:11.5px; color:var(--bronze); font-weight:600; letter-spacing:.3px; margin-bottom:9px;}
  .analogy-card p{color:#d8d1bd; font-size:14.3px; margin-bottom:0; margin-top:8px;}

  .scenario-box{background:var(--paper-2); border-left:3px solid var(--bronze); padding:16px 18px; margin-bottom:18px; border-radius:2px;}
  .scenario-box .who{font-family:'Source Serif 4',serif; font-weight:600; color:var(--navy-900); font-size:15.5px; margin-bottom:5px;}
  .scenario-box p{font-size:14.5px; margin-bottom:0; color:var(--ink);}

  .question-block{margin-bottom:22px;}
  .question-block .qtext{font-size:15px; font-weight:600; color:var(--navy-900); margin-bottom:10px; font-family:'Source Serif 4',serif;}
  .option{display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border:1px solid var(--line); border-radius:2px; margin-bottom:7px; cursor:pointer; background:#fff; transition:border-color .15s,background .15s;}
  .option:hover{border-color:var(--navy-700);}
  .option input{margin-top:3px; flex:0 0 auto;}
  .option .otext{font-size:14px; color:var(--ink);}
  .option.correct{border-color:var(--success); background:var(--success-bg);}
  .option.incorrect{border-color:var(--error); background:var(--error-bg);}
  .option.locked{cursor:default;}
  .feedback-box{margin-top:8px; padding:12px 15px; border-radius:2px; font-size:13.8px; display:none;}
  .feedback-box.show{display:block;}
  .feedback-box.correct{background:var(--success-bg); border:1px solid var(--success); color:#274f31;}
  .feedback-box.incorrect{background:var(--error-bg); border:1px solid var(--error); color:#6e2e2a;}
  .feedback-box .verdict{font-weight:700; display:block; margin-bottom:3px; font-family:'Source Serif 4',serif; font-size:14.5px;}

  .btn-row{display:flex; gap:10px; margin-top:22px; padding-top:16px; border-top:1px solid var(--line); justify-content:space-between; flex-wrap:wrap;}
  .btn{font-size:13.5px; font-weight:600; padding:10px 20px; border-radius:2px; border:1px solid var(--navy-900); background:var(--navy-900); color:#f4eedd; cursor:pointer; transition:background .15s;}
  .btn:hover{background:var(--navy-700);}
  .btn.ghost{background:none; color:var(--navy-900); border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--navy-900);}
  .btn.small{padding:6px 14px; font-size:12.5px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .route-row{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}

  .breathing-wrap{display:flex; flex-direction:column; align-items:center; padding:26px 10px; margin-bottom:10px;}
  .breathing-circle{width:110px; height:110px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #cfa24d, var(--bronze-dark)); animation:breathe 14s ease-in-out infinite; box-shadow:0 0 0 1px var(--bronze);}
  @keyframes breathe{0%{transform:scale(.62);} 28%{transform:scale(1);} 57%{transform:scale(1);} 100%{transform:scale(.62);}}
  .breathing-hint{margin-top:16px; font-size:13px; color:var(--ink-soft); text-align:center;}

  .field-label{display:block; font-size:13px; font-weight:600; color:var(--navy-800); margin:12px 0 6px;}
  .field-input{width:100%; font-family:'Inter'; font-size:13.8px; padding:9px 11px; border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--ink); resize:vertical;}
  .field-input.line{margin-bottom:8px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .record-row{display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap;}
  .record-row audio{max-width:100%;}

  .final-summary{background:#fff; border:1px solid var(--line); border-radius:2px; padding:22px 24px; margin-bottom:16px;}
  .final-summary .level{font-family:'Source Serif 4',serif; font-size:19px; color:var(--navy-900); margin-bottom:6px;}
  .final-summary .bar-track{height:8px; background:var(--paper-2); border-radius:4px; overflow:hidden; margin:10px 0 16px;}
  .final-summary .bar-fill{height:100%; background:var(--bronze);}

  .result-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .result-tile{border:1px solid var(--line); border-radius:2px; padding:14px 16px; background:#fff;}
  .result-tile .n{font-family:'Source Serif 4',serif; font-size:26px; color:var(--navy-900);}
  .result-tile .lbl{font-size:12px; color:var(--ink-soft);}
  .result-tile.ok .n{color:var(--success);}

  table.data-table{width:100%; border-collapse:collapse; margin-bottom:14px; font-size:13px;}
  table.data-table th{background:var(--navy-900); color:#f4eedd; text-align:left; padding:9px 10px; font-size:12px;}
  table.data-table td{border:1px solid var(--line); padding:9px 10px; vertical-align:top; background:#fff;}
  table.data-table tr:nth-child(even) td{background:var(--paper-2);}
  .info-table td, .info-table th{font-size:13px;}

  .matrix-row{display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:start;}
  .matrix-row textarea{min-height:52px;}
  .matrix-remove{background:none; border:1px solid var(--line); color:var(--error); border-radius:2px; padding:6px 10px; cursor:pointer; font-size:12px; height:fit-content;}
  @media (max-width:640px){.matrix-row{grid-template-columns:1fr;}}

  .rubric-mini{width:100%; font-size:12px; margin-top:6px; padding:6px 8px; border:1px solid var(--line); border-radius:2px; background:#fff;}

  footer.note{padding:20px 28px 34px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line); margin-top:8px;}

  @media (max-width:600px){
    .panel{padding:22px 16px 6px;}
    .institutional{padding:18px 16px;}
    .result-grid{grid-template-columns:1fr;}
    .step-btn{min-width:74px; font-size:10px;}
    .analogy-card{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================= GLOSARIO ============================= */
const GLOSSARY = {
  "creencias tácitas": "Convicciones que el docente sostiene sin haberlas hecho explícitas, aunque guían su actuación.",
  "currículo oculto": "Aprendizajes y normas no declaradas que se transmiten junto al currículo oficial.",
  "constructos": "Categorías internas que una persona usa para interpretar la realidad.",
  "sociocognitivo": "Relativo a cómo el pensamiento se forma a partir de la interacción social y la experiencia.",
  "intención intrínseca": "Motivación que nace de la propia persona, no impuesta desde fuera.",
  "crisis de los 40": "Etapa de replanteamiento personal y profesional asociada a la mitad de la carrera docente.",
  "identidad profesional docente": "Proceso continuo de construir y responder quién es uno como docente."
};
function applyGlossary(text){
  let out = text;
  const terms = Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
  terms.forEach(term=>{
    const escaped = term.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&');
    const re = new RegExp('\\b('+escaped+')\\b', 'i');
    out = out.replace(re, function(match){
      const def = GLOSSARY[term].replace(/"/g,'&quot;');
      return '<abbr class="gloss" title="'+def+'">'+match+'</abbr>';
    });
  });
  return out;
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================= CONTENIDO TEÓRICO ============================= */
const THEORY = [
  {tag:"Impacto de las creencias", title:"Cómo las creencias moldean la práctica",
   body:`Existe abundante literatura que muestra que las creencias de los docentes impactan
   considerablemente sus percepciones y sus juicios, los cuales, a su vez, afectan su actuación en
   el aula. Estos sistemas de creencias son una parte esencial para mejorar la formación profesional
   y, por ende, la efectividad docente. Pueden ser influenciadas tanto por la formación profesional
   como por la cultura y las teorías personales sobre la enseñanza-aprendizaje.`,
   authors:"Biddle et al. (2000)"},
  {tag:"Factores contextuales", title:"Lo que determina la práctica más allá de la creencia",
   body:`Las prácticas pedagógicas también están determinadas por realidades sociales, psicológicas
   y contextuales de la institución y del aula: los requerimientos de las autoridades, la
   institución y la sociedad, los principios curriculares, la distribución de las aulas, las
   políticas institucionales, los colegas, el uso de exámenes estandarizados, el estudiantado poco
   motivado, un currículo rígido, los docentes con más antigüedad y la disponibilidad de recursos
   didácticos. Estos factores pueden limitar la capacidad del docente para actuar de forma
   coherente con lo que cree.`,
   authors:"Andrews (2003); Bailey et al. (2001); Johnstone (1999); Maclellan y Soden (2003); Richards (2001)"},
  {tag:"Condiciones laborales", title:"Cuando el entusiasmo choca con la organización",
   body:`Las condiciones laborales difíciles pueden influir en lo que hace el docente y entrar en
   conflicto con su forma de pensar. El entusiasmo inicial puede verse afectado por exigencias
   organizacionales que escapan a su control, lo cual puede desincentivar la experimentación y la
   innovación pedagógica, y promover la estrategia más segura de apegarse a los enfoques y
   materiales ya prescritos.`,
   authors:"Ver también Andrews (2003) y colaboradores"},
  {tag:"Persistencia", title:"Creencias que se forman temprano y se resisten al cambio",
   body:`Las creencias docentes se forman tempranamente y tienden a autoperpetuarse, persistiendo
   frente a la contradicción que puedan causar el tiempo, la razón, la escolaridad o la experiencia.
   Los procesos de pensamiento pueden ser, a la vez, precursores y creadores de esas creencias.`,
   authors:"Introducción a la Unidad 2"},
  {tag:"Definición (2.1)", title:"¿Qué son las creencias docentes?",
   body:`Las creencias se definen como un sistema de <abbr class="gloss" title="Categorías internas que una persona usa para interpretar la realidad.">constructos</abbr>
   que el docente usa cuando piensa, evalúa, clasifica y guía su actuación pedagógica. Responden casi
   siempre al sentido común y son de naturaleza <abbr class="gloss" title="Convicciones que el docente sostiene sin haberlas hecho explícitas, aunque guían su actuación.">tácita</abbr>. Influyen en la
   actuación docente más que los conocimientos disciplinarios que se poseen, y suelen estar bien
   asentadas cuando el estudiantado llega a la universidad.`,
   authors:"González et al. (2001); Scovel (2001)"},
  {tag:"Función de filtro", title:"Las creencias como filtro del pensamiento",
   body:`Las creencias están íntimamente relacionadas con lo que se cree que se sabe, pero además
   ofrecen un filtro eficaz que discrimina, redefine, distorsiona o modifica el pensamiento y el
   procesamiento posterior de la información. Las creencias del docente respecto a lo que es
   enseñar afectan toda su actuación dentro del aula, sean estas creencias implícitas o explícitas.`,
   authors:"González et al. (2001); Scovel (2001)"},
  {tag:"El lado oculto (2.1.1)", title:"Lo que se actúa sin haberse pensado del todo",
   body:`Aunque un docente actúe de forma espontánea o por costumbre, sin pensar conscientemente en
   la acción, dicha actuación surge de una creencia profundamente enraizada que puede que nunca se
   haya explicitado. Esas creencias sobre cómo se aprende impregnan las actuaciones en el aula más
   que el método concreto que se esté obligado a adoptar o el texto que se utilice. Por eso, estudiar
   las creencias del docente implica explorar el lado oculto de la enseñanza.`,
   authors:"Richards (1999); Roberts (2002); Tsui (2003)"},
  {tag:"Dos procesos sociocognitivos", title:"Aprender a enseñar y saber qué hacer",
   body:`La formación de creencias se sustenta en dos procesos <abbr class="gloss" title="Relativo a cómo el pensamiento se forma a partir de la interacción social y la experiencia.">sociocognitivos</abbr> interrelacionados.
   El primero examina el aprendizaje del docente: cómo aprende a enseñar. El segundo, de carácter más
   epistemológico, es el conocimiento docente: cómo sabe lo que debe hacer para hacer lo que hace. Es
   difícil conceptualizar cómo aprenden los docentes sin alguna noción de qué es exactamente lo que
   están aprendiendo.`,
   authors:"Introducción a la Unidad 2"},
  {tag:"Cambio y trayectoria", title:"Un cambio que ocurre en dos planos a la vez",
   body:`Durante toda la carrera profesional del docente se producen cambios, no solo en el plano
   profesional sino también en el personal. Ambos planos se influyen mutuamente y de manera
   continua, modificando las formas de pensar y de entender tanto la vida personal como la
   profesional. Por eso las creencias son difíciles de modificar: los cambios se dan a lo largo de
   toda la carrera, mediante distintas interpretaciones asociadas al desarrollo personal.`,
   authors:"Fernández Cruz (1995)"},
  {tag:"Influencias externas", title:"Lo que además de los cambios influye en el docente",
   body:`Además de los cambios mismos, el docente está influenciado por la familia, su propia
   disposición individual, la regulación organizativa del centro, los estilos de dirección, las
   expectativas sociales y la organización profesional a la que pertenece. Cambios e influencias
   determinan, en distinta medida, las fases del ciclo de vida profesional del docente.`,
   authors:"Fressler (1985)"},
  {tag:"Condiciones para el cambio", title:"Qué hace posible transformar una creencia",
   body:`Para que se produzcan cambios en las creencias en cualquiera de las etapas de la carrera,
   se necesita una <abbr class="gloss" title="Motivación que nace de la propia persona, no impuesta desde fuera.">intención intrínseca</abbr>
   y una necesidad real de modificar lo ya existente: las teorías, visiones, pasiones,
   preocupaciones, la personalidad y las creencias formativas dan al docente la posibilidad de
   desarrollar su capacidad de elección. La superación de los modelos de enseñanza tradicionales
   vendrá generada por un cambio en las creencias formativas, y ese cambio deberá responder a las
   necesidades educativas que la sociedad plantea a los docentes.`,
   authors:"Estepa (2000); Beattie (2001); Quinlan (1999)"}
];

const DIMENSIONS = [
  {title:"El cambio como formación", body:"El cambio es algo realizado por el propio profesor."},
  {title:"El cambio como adaptación", body:"El profesor cambia como respuesta a alguna circunstancia."},

/* ============================= AUDIO (TTS) ============================= */
function speakText(btnId, text){
  if(!('speechSynthesis' in window)){ alert('Tu navegador no permite lectura en voz alta en este momento.'); return; }
  const btn = document.getElementById(btnId);
  if(window.__speakingBtn === btnId){
    speechSynthesis.cancel(); window.__speakingBtn=null;
    if(btn) btn.textContent = btn.dataset.label || '🔊 Escuchar';
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text.replace(/\s+/g,' ').trim());
  utter.lang='es-ES'; utter.rate=0.98;
  utter.onend = function(){ window.__speakingBtn=null; if(btn) btn.textContent = btn.dataset.label || '🔊 Escuchar'; };
  window.__speakingBtn = btnId;
  if(btn){ btn.dataset.label = btn.textContent; btn.textContent='⏸ Detener'; }
  speechSynthesis.speak(utter);
}
function speakTheory(i){ const t=THEORY[i]; speakText('audio-theory-'+i, t.title+'. '+t.body.replace(/<[^>]+>/g,'')); }
function speakAnalogy(i){ const a=ANALOGIES[i]; speakText('audio-an-'+i, a.title+'. '+a.body); }
function speakNarrativa(i){ const n=NARRATIVA_ETAPAS[i]; speakText('audio-nar-'+i, n.title+'. '+n.body); }

function renderQuizQuestion(qIndex, q, answeredCorrect){
  const answered = answeredCorrect !== undefined;
  return `

      ${q.options.map((opt,oi)=>{

        return `<label class="${cls}" onclick="${answered?'':`answerQuiz(${qIndex},${oi})`}">
          <input type="radio" name="q-quiz-${qIndex}" ${answered?'disabled':''}>
          <span class="otext">${opt.text}</span>
        </label>`;
      }).join('')}
      <div class="feedback-box ${answered?(answeredCorrect?'correct show':'incorrect show'):''}">
        ${answered? quizFeedbackHtml(qIndex, answeredCorrect):''}
      </div>
    </div>
  `;

function quizFeedbackHtml(qIndex, wasCorrect){
  const q = QUIZ[qIndex];
  const chosen = window.__lastQuizChoice[qIndex];
  const opt = chosen!==undefined ? q.options[chosen] : q.options.find(o=>o.correct);
  return `<span class="verdict">${wasCorrect?"Correcto":"No del todo"}</span>${opt.feedback}`;
}
function answerQuiz(qIndex, optIndex){
  const q = QUIZ[qIndex]; const opt = q.options[optIndex];
  window.__lastQuizChoice[qIndex]=optIndex;
  state.quizAnswers[qIndex] = !!opt.correct;
  render();

}

/* ---------- Acción reflexiva: Cartografías de la incertidumbre ---------- */
async function startRecordingReflexion(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
    mediaRecorder.onstop = function(){
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      state.reflexion.audioUrl = URL.createObjectURL(blob);
      stream.getTracks().forEach(t=>t.stop());
      render();
    };
    mediaRecorder.start();
    state.reflexion.recording = true;
    state.reflexion.recordError = false;
    render();
  }catch(err){ state.reflexion.recordError = true; render(); }
}
function stopRecordingReflexion(){
  if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.stop(); }
  state.reflexion.recording = false;
}
function resetRecordingReflexion(){ state.reflexion.audioUrl=null; state.reflexion.recordError=false; render(); }

function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight){
  const words = text.split(' '); let line='';
  for(let n=0;n<words.length;n++){
    const test=line+words[n]+' ';
    if(ctx.measureText(test).width>maxWidth && n>0){ ctx.fillText(line,x,y); line=words[n]+' '; y+=lineHeight; }
    else line=test;
  }
  ctx.fillText(line,x,y); return y+lineHeight;
}

  if(state.bitacora.targetBelief){
    ctx.fillStyle='#24221d'; ctx.font="13px Arial";
    y = wrapCanvasText(ctx, 'Creencia en transformación: '+state.bitacora.targetBelief.slice(0,200), 30, y, 740, 18);
  }
  const link=document.createElement('a'); link.download='tarjeta_resumen_creencias_pedagogicas.png'; link.href=canvas.toDataURL('image/png'); link.click();
}

function renderCierre(){
  const correct = state.quizAnswers.filter(Boolean).length;
  return `
    <div class="eyebrow">Cierre del simulador</div>
    <h2>Tu recorrido por la Unidad 2, en un solo lugar</h2>
    <p class="lead">Descarga un resumen para tu Portafolio y prepara lo que compartirás con un
    compañero o con tu profesor de Prácticum.</p>
    <div class="result-grid">
      <div class="result-tile ok"><div class="n">${correct}/${QUIZ.length}</div><div class="lbl">Prueba de conocimientos</div></div>
      <div class="result-tile"><div class="n">${state.bitacora.plenariaDone?'Sí':'—'}</div><div class="lbl">Plenaria realizada</div></div>
    </div>
    <div class="card">
      <span class="tag">Para compartir con un par</span>
      <label class="field-label">Escribe brevemente lo que te gustaría compartir sobre la creencia que estás transformando:</label>
      <textarea class="field-input" rows="3" oninput="state.peer=this.value">${escapeHtml(state.peer)}</textarea>
    </div>
    <div class="btn-row" style="justify-content:flex-start; gap:12px; border-top:none; padding-top:0;">
      <button class="btn" onclick="downloadTextSummary()">Descargar resumen (texto)</button>
      <button class="btn ghost" onclick="downloadVisualSummary()">Descargar tarjeta visual (PNG)</button>
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="back()">← Atrás</button>
      <span></span>
    </div>
  `;
}

render();
</script>
</body>
</html>
